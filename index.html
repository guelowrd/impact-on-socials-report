<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guardian Campaign — Impact on Socials Reports</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 640px; margin: 0 auto; padding: 48px 24px; line-height: 1.5;
      color: #1a1a1a; background: #fafafa;
    }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    p.sub { color: #666; margin-top: 0; }
    ul { list-style: none; padding: 0; margin-top: 32px; }
    li { margin: 0 0 14px; }
    a.report {
      display: block; padding: 16px 18px; border: 1px solid #e0e0e0; border-radius: 10px;
      text-decoration: none; color: inherit; background: #fff; transition: border-color .15s, transform .15s;
    }
    a.report:hover { border-color: #999; transform: translateY(-1px); }
    a.report .title { font-weight: 600; }
    a.report .date { color: #888; font-size: .9rem; }
    footer { margin-top: 40px; color: #aaa; font-size: .8rem; }
    @media (prefers-color-scheme: dark) {
      body { color: #e6e6e6; background: #161616; }
      p.sub { color: #999; }
      a.report { background: #1f1f1f; border-color: #333; }
      a.report:hover { border-color: #666; }
      a.report .date { color: #888; }
    }
  </style>
</head>
<body>
  <h1>Guardian Campaign</h1>
  <p class="sub">Impact-on-socials reports</p>
  <ul>
    <li>
      <a class="report" href="./2026-06-11/">
        <span class="title">End-of-Campaign Review</span><br>
        <span class="date">June 11, 2026</span>
      </a>
    </li>
    <li>
      <a class="report" href="./2026-05-14/">
        <span class="title">Campaign Impact</span><br>
        <span class="date">May 14, 2026</span>
      </a>
    </li>
  </ul>
  <footer>Hosted on GitHub Pages.</footer>
</body>
</html>
